# 音声操作エージェントの設定（秘密情報は .env に書く）

model:
  base_url: http://172.25.5.48:8000/v1   # .env の VA_BASE_URL があればそちらを優先
  name: GLM-5.3-Flash-EXL3               # .env の VA_MODEL があればそちらを優先
  temperature: 0.2
  timeout_secs: 60          # 思考なしの1回あたり
  timeout_secs_thinking: 90 # 思考ありの1回あたり（超えたら接続を切り、サーバー側の生成も止める）
  max_tokens_thinking: 3000 # 思考ありの出力トークン上限（約70秒）。超えたら思考なしで聞き直す
                            # ※ フェーズ7で上限なしの思考が 8,600 トークン・205 秒かかり、GPU を使い続けた
  # 思考モード: off = chat_template_kwargs.enable_thinking=false
  #             low = reasoning_effort: "low"
  #             on  = モデル既定（思考あり）
  # ※ YAML では引用符なしの off / on が真偽値になるので、必ず引用符で囲む
  thinking_normal: "off"    # 通常ステップ
  thinking_stuck: "on"      # 行き詰まったとき

screen:
  model_image_width: 1512   # モデルに送る画像の幅（px）。0 なら縮小しない
  jpeg_quality: 90

# モデルの x, y は「送った画像のピクセル座標」（フェーズ3の検証結果による）。
# コードが画像の範囲内か検証してから実画面座標に換算する。

agent:
  dry_run: true             # true: 操作せず、実行内容を表示するだけ（--live で実際に操作）
  max_steps: 25             # これを超えたら強制停止
  history_steps: 8          # モデルに送る直近ステップの1行要約の数
  settle_max: 1.5           # 操作後、画面が落ち着くまで待つ最大秒数
  settle_max_open_app: 4.0  # open_app の後はアプリの起動を待つので長め
  maximize_on_open: true    # open_app で前面にしたウィンドウを最大化（他のウィンドウとの重なりでクリックが外れないように）
  think_after_no_change: 2  # 画面が変わらない操作がこの回数続いたら思考を強める
  think_after_bad_json: 2   # 無効な返答がこの回数続いたら思考を強める
  think_after_blocked: 2    # 繰り返しでブロックされた手がこの回数続いたら思考を強める
  give_up_after_blocks: 4   # 1回の実行でブロックがこの回数に達したら、行き詰まりとして打ち切る（0 = 打ち切らない）
  repeat_max: 3             # 同じクリック・open_app を直近10手でこの回数行っていたら、次はブロック（間に別の操作をはさんでも）

# open_app で起動・前面化してよいアプリ（ここにないアプリは拒否）
#   names:   モデルやユーザーが使う呼び名（大文字小文字は区別しない）
#   launch:  起動コマンド（App Paths で解決できる実行ファイル名）
#   process: 起動後のウィンドウのプロセス名（target_app の照合にも使う）
apps:
  - names: [メモ帳, notepad]
    launch: notepad.exe
    process: [notepad.exe]
  - names: [電卓, calculator, calc]
    launch: calc.exe
    process: [CalculatorApp.exe, calc.exe]
  - names: [Edge, Microsoft Edge, ブラウザ, browser]
    launch: msedge.exe
    process: [msedge.exe]
  - names: [ペイント, paint, mspaint]
    launch: mspaint.exe
    process: [mspaint.exe]
  # エクスプローラーは入れない: アドレス欄に "cmd" などと入力すると、許可リスト外のプログラムを起動できてしまうため

# 安全ルール（プロンプトではなくコードで強制する）
safety:
  # これらの語が「入力する文字列」「reason」「クリック先の要素名（UI Automation）」に含まれたら、実行前に人間が確認する
  # 日本語は部分一致、英語は単語単位で照合
  risky_words: [送信, 送る, 削除, 消去, 消す, 購入, 買う, 注文, 支払, 決済, 提出, 投稿, 公開, 送金, 振込, 振り込,
                ゴミ箱を空, 完全に削除, send, delete, remove, buy, purchase, order, pay, checkout, submit, post,
                publish, transfer, erase]
  # 確認が必要なキー（送信・削除のショートカット）
  risky_keys: [delete, shift+delete, ctrl+enter, ctrl+shift+enter, alt+s, ctrl+d, alt+f4]
  # 実行を拒否するキー（Windows キーの組み合わせは、許可リスト外のアプリを起動できるので一律拒否）
  blocked_keys: [win, ctrl+esc, ctrl+shift+esc, ctrl+alt+delete]
  # パスワードの入力とみなす語（reason・要素名に含まれたら入力を拒否）
  password_words: [パスワード, 暗証番号, password, passcode, passwd]
  # この前面アプリへのキー入力・文字入力は拒否する（エージェント自身の端末・開発ツールなど）
  protected_processes: [WindowsTerminal.exe, OpenConsole.exe, cmd.exe, conhost.exe, powershell.exe, pwsh.exe,
                        python.exe, claude.exe, Code.exe, Cursor.exe, ttermpro.exe, mstsc.exe,
                        SearchHost.exe, StartMenuExperienceHost.exe, explorer.exe]
  confirm_timeout_secs: 30  # 確認ダイアログに答えがなければ「いいえ」
  stop_key: esc             # このキーで即時停止（人が押したときだけ。プログラムが送ったキーは無視）

# 音声入出力（フェーズ7）。--voice で使う
voice:
  ptt_key: f9               # 押している間だけ録音するキー（f1〜f24, pause, scroll_lock, insert, right_ctrl など）
  ptt_suppress: true        # このキーを前面アプリに渡さない（アプリ側で F9 が別の意味を持っていても動かないように）
  input_device: null        # マイク（null = Windows の既定。番号か名前の一部で指定）
  mic_always_on: true       # 音声モードの間マイクを開いたままにする（押した瞬間の話し始めが切れないように）
  preroll_secs: 0.5         # キーを押す直前の何秒分を録音に含めるか（mic_always_on のときだけ）
  min_secs: 0.4             # これより短い録音は無視（押し間違い）
  max_secs: 30              # これより長い録音は打ち切り
  min_level: 0.003          # 音量（RMS）がこれ未満なら無音とみなす
  stt:
    model: small            # small / large-v3-turbo など（models/ に置く。初回だけダウンロード）
    compute_type: int8
    cpu_threads: 0          # 0 = 自動
    beam_size: 5
    vad_filter: true        # 無音部分を除いてから認識する（無音での幻の文を減らす）
    # 認識の手がかり: 日本人が PC 操作で口にする英語・カタカナ語の一覧（英語の固有名詞の認識がよくなる）。
    # - 書いた表記で出やすくなる（例: 「クローム」ではなく「Chrome」）。エージェントのモデルはどちらの表記でも理解する
    # - 先頭ほど優先。合計が max_prompt_tokens を超えた分は使わない（起動時に表示する）
    #   Whisper の手がかりは約 223 トークンまでで、長いほど手がかりの言葉をそのまま返す誤りも増えるため
    # - 文（「〜を操作します」など）は書かない: 聞き取れないとき Whisper がその文を返し、指示として実行されてしまう
    # - 展示で使うサイト名・製品名は、先頭のほうに足す
    max_prompt_tokens: 150
    vocabulary:
      # ブラウザ・検索・よく使うサイト（Whisper がカタカナ崩れや聞き違いを起こしやすいもの）
      - Chrome
      - Edge
      - Google
      - Yahoo! JAPAN
      - YouTube
      - GitHub
      - NVIDIA
      - ChatGPT
      - Wikipedia
      - Amazon
      # Microsoft 365・コミュニケーション
      - Microsoft
      - Windows
      - Excel
      - Word
      - PowerPoint
      - Outlook
      - Teams
      - Gmail
      - Zoom
      - Slack
      # 画面の部品・操作（カタカナ語）
      - Go to file
      - URL
      - PDF
      - アドレスバー
      - 検索ボックス
      - タブ
      - ダウンロード
      - ログイン
      # このデモで開けるアプリ
      - メモ帳
      - 電卓
      - ペイント
      # ここから下は上限を超えると使われない（優先度低）
      - LINE
      - Instagram
      - 楽天
      - OneDrive
      - Copilot
      - Wi-Fi
      - Bluetooth
      - USB
      - AI
      - ウィンドウ
      - メニュー
      - ボタン
      - アイコン
      - スクロール
      - ダブルクリック
      - コピー
      - ペースト
  tts:
    # sapi:    Windows の SAPI5 を直接使う（既定）
    # pyttsx3: pyttsx3 経由。この PC では2回目以降の読み上げが途中で切れた（フェーズ7で確認）
    # none:    読み上げない
    engine: sapi
    voice: Haruka           # 音声名の一部（なければ日本語の音声 → 既定）
    rate: 0                 # 話す速さ -10（遅い）〜 10（速い）
    volume: 1.0             # 0.0〜1.0
    # 読み上げる種類: start（わかりました）/ reason（各操作の理由）/ confirm（確認のお願い）/ blocked / result（結果）
    speak: [start, reason, confirm, blocked, result]
