# 音声操作エージェントの設定（秘密情報は .env に書く）

model:
  base_url: http://172.25.5.48:8000/v1   # .env の VA_BASE_URL があればそちらを優先
  name: GLM-5.3-Flash-EXL3               # .env の VA_MODEL があればそちらを優先
  temperature: 0.2
  timeout_secs: 60          # 思考なしの1回あたり
  timeout_secs_thinking: 240
  # 思考モード: off = chat_template_kwargs.enable_thinking=false
  #             low = reasoning_effort: "low"
  #             on  = モデル既定（思考あり）
  # ※ YAML では引用符なしの off / on が真偽値になるので、必ず引用符で囲む
  thinking_normal: "off"    # 通常ステップ
  thinking_stuck: "on"      # 行き詰まったとき

screen:
  model_image_width: 1512   # モデルに送る画像の幅（px）。0 なら縮小しない
  jpeg_quality: 90

# モデルの x, y は「送った画像のピクセル座標」（フェーズ3の検証結果による）。
# コードが画像の範囲内か検証してから実画面座標に換算する。

agent:
  dry_run: true             # true: 操作せず、実行内容を表示するだけ（--live で実際に操作）
  max_steps: 25             # これを超えたら強制停止
  history_steps: 8          # モデルに送る直近ステップの1行要約の数
  settle_max: 1.5           # 操作後、画面が落ち着くまで待つ最大秒数
  settle_max_open_app: 4.0  # open_app の後はアプリの起動を待つので長め
  think_after_no_change: 2  # 画面が変わらない操作がこの回数続いたら思考を強める
  think_after_bad_json: 2   # 無効な返答がこの回数続いたら思考を強める
  think_after_blocked: 2    # 繰り返しでブロックされた手がこの回数続いたら思考を強める

# open_app で起動・前面化してよいアプリ（ここにないアプリは拒否）
#   names:   モデルやユーザーが使う呼び名（大文字小文字は区別しない）
#   launch:  起動コマンド（App Paths で解決できる実行ファイル名）
#   process: 起動後のウィンドウのプロセス名（target_app の照合にも使う）
apps:
  - names: [メモ帳, notepad]
    launch: notepad.exe
    process: [notepad.exe]
  - names: [電卓, calculator, calc]
    launch: calc.exe
    process: [CalculatorApp.exe, calc.exe]
  - names: [Edge, Microsoft Edge, ブラウザ, browser]
    launch: msedge.exe
    process: [msedge.exe]
  - names: [ペイント, paint, mspaint]
    launch: mspaint.exe
    process: [mspaint.exe]
  # エクスプローラーは入れない: アドレス欄に "cmd" などと入力すると、許可リスト外のプログラムを起動できてしまうため

# 安全ルール（プロンプトではなくコードで強制する）
safety:
  # これらの語が「入力する文字列」「reason」「クリック先の要素名（UI Automation）」に含まれたら、実行前に人間が確認する
  # 日本語は部分一致、英語は単語単位で照合
  risky_words: [送信, 送る, 削除, 消去, 消す, 購入, 買う, 注文, 支払, 決済, 提出, 投稿, 公開, 送金, 振込, 振り込,
                ゴミ箱を空, 完全に削除, send, delete, remove, buy, purchase, order, pay, checkout, submit, post,
                publish, transfer, erase]
  # 確認が必要なキー（送信・削除のショートカット）
  risky_keys: [delete, shift+delete, ctrl+enter, ctrl+shift+enter, alt+s, ctrl+d, alt+f4]
  # 実行を拒否するキー（Windows キーの組み合わせは、許可リスト外のアプリを起動できるので一律拒否）
  blocked_keys: [win, ctrl+esc, ctrl+shift+esc, ctrl+alt+delete]
  # パスワードの入力とみなす語（reason・要素名に含まれたら入力を拒否）
  password_words: [パスワード, 暗証番号, password, passcode, passwd]
  # この前面アプリへのキー入力・文字入力は拒否する（エージェント自身の端末・開発ツールなど）
  protected_processes: [WindowsTerminal.exe, OpenConsole.exe, cmd.exe, conhost.exe, powershell.exe, pwsh.exe,
                        python.exe, claude.exe, Code.exe, Cursor.exe, ttermpro.exe, mstsc.exe,
                        SearchHost.exe, StartMenuExperienceHost.exe, explorer.exe]
  confirm_timeout_secs: 30  # 確認ダイアログに答えがなければ「いいえ」
  stop_key: esc             # このキーで即時停止（人が押したときだけ。プログラムが送ったキーは無視）
