[project]
name = "voice-agent"
version = "0.1.0"
description = "日本語の音声指示で Windows の画面を操作するコンピュータ操作エージェント（展示デモ用）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "mss>=10.2.0",
    "numpy>=2.5.5",
    "openai>=3.55.0",
    "pillow>=13.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.4",
    "pyttsx3>=2.99",
    "pywin32>=312",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "uiautomation>=2.0.29",
]

[project.scripts]
voice-agent = "voice_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
